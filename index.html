        // -------- ENGINE (No changes needed) --------
        let currentIndex = 0;
        let score = 0;
        let isAnswered = false;

        const questionEl = document.getElementById('question');
        const optionsContainer = document.getElementById('options-container');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const feedbackEl = document.getElementById('feedback');
        const counterEl = document.getElementById('question-counter');
        const scoreCounter = document.getElementById('score-counter');
        const finalScore = document.getElementById('final-score');
        const totalQuestions = document.getElementById('total-questions');

        totalQuestions.textContent = questions.length;

        function loadQuestion(index) {
            isAnswered = false;
            const q = questions[index];
            questionEl.textContent = `${index + 1}. ${q.q}`;
            counterEl.textContent = `Question ${index + 1}/${questions.length}`;

            optionsContainer.innerHTML = '';
            q.options.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'option-item';
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'mcq';
                radio.value = i;
                radio.id = `opt-${i}`;
                const label = document.createElement('label');
                label.htmlFor = `opt-${i}`;
                label.textContent = opt;

                div.appendChild(radio);
                div.appendChild(label);
                optionsContainer.appendChild(div);

                div.addEventListener('click', function(e) {
                    if (isAnswered) return;
                    const radioInput = this.querySelector('input[type="radio"]');
                    radioInput.checked = true;
                    document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
                    this.classList.add('selected');
                });
            });

            feedbackEl.className = 'feedback';
            feedbackEl.style.display = 'none';
            submitBtn.disabled = false;
            submitBtn.style.display = 'inline-block';
            nextBtn.style.display = 'none';
            document.querySelectorAll('.option-item').forEach(el => {
                el.classList.remove('correct', 'wrong', 'selected');
            });

            scoreCounter.textContent = score;
            finalScore.textContent = score;
        }

        function checkAnswer() {
            if (isAnswered) return;
            const selected = document.querySelector('input[name="mcq"]:checked');
            if (!selected) {
                alert('Please select an option!');
                return;
            }
            const selectedValue = parseInt(selected.value);
            const currentQ = questions[currentIndex];
            const isCorrect = (selectedValue === currentQ.ans);

            const allOptions = document.querySelectorAll('.option-item');
            allOptions.forEach((el, idx) => {
                if (idx === currentQ.ans) {
                    el.classList.add('correct');
                } else if (idx === selectedValue && !isCorrect) {
                    el.classList.add('wrong');
                }
                el.querySelector('input[type="radio"]').disabled = true;
            });

            if (isCorrect) {
                score++;
                scoreCounter.textContent = score;
                finalScore.textContent = score;
                feedbackEl.textContent = '✅ Correct Answer! Great job!';
                feedbackEl.className = 'feedback show correct';
            } else {
                const correctText = currentQ.options[currentQ.ans];
                feedbackEl.textContent = `❌ Incorrect! The correct answer was: "${correctText}"`;
                feedbackEl.className = 'feedback show wrong';
            }

            isAnswered = true;
            submitBtn.disabled = true;
            submitBtn.style.display = 'none';
            nextBtn.style.display = 'inline-block';
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                questionEl.textContent = '🎉 Congratulations! You have completed all 163 questions!';
                optionsContainer.innerHTML = '';
                feedbackEl.style.display = 'none';
                submitBtn.style.display = 'none';
                nextBtn.style.display = 'none';
                document.querySelector('.status-bar').innerHTML = `<span>✅ Quiz Complete!</span><span>Score: ${score}/${questions.length}</span>`;
                finalScore.textContent = score;
            }
        }

        submitBtn.addEventListener('click', checkAnswer);
        nextBtn.addEventListener('click', nextQuestion);

        loadQuestion(0);
    </script>
