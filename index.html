        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg-body);

            align-items: center;
            min-height: 100vh;
            padding: 16px;
            margin: 0;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            max-width: 720px;
            width: 100%;
            background: var(--bg-container);
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: background 0.3s, border 0.3s;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 22px;
            color: var(--text-primary);
            border-bottom: 3px solid var(--btn-primary);
            padding-bottom: 5px;
            display: inline-block;
            margin: 0;
        }
        .dark-toggle {
            background: var(--option-bg);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 8px 15px;
            cursor: pointer;
            font-size: 20px;
            color: var(--text-primary);
            transition: 0.2s;
        }
        .dark-toggle:hover { background: var(--option-hover); }
        .progress-container {
            width: 100%;
            height: 8px;
            background: var(--progress-bg);
            border-radius: 10px;
            margin: 10px 0 20px 0;
            overflow: hidden;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: var(--btn-primary);
            transition: width 0.4s ease;
            border-radius: 10px;
        }
        .status-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: var(--option-bg);
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 600;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            gap: 10px;
        }
        .timer-box {
            font-size: 18px;
            color: var(--text-primary);
            background: var(--bg-container);
            padding: 2px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }
        .timer-box.warning { color: #ef4444; border-color: #ef4444; }
        #question {
            font-size: 20px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .option-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--option-bg);
            padding: 14px 18px;
            border-radius: 14px;
            border: 2px solid var(--option-border);
            transition: 0.15s ease;
            cursor: pointer;
        }
        .option-item:hover { background: var(--option-hover); border-color: #94a3b8; }
        .option-item.selected { border-color: var(--btn-primary); background: #eff6ff; }
        .option-item.correct { border-color: #22c55e; background: var(--correct-bg); }
        .option-item.wrong { border-color: #ef4444; background: var(--wrong-bg); }
        .option-item input[type="radio"] {
            width: 18px; height: 18px; accent-color: var(--btn-primary);
            margin: 0; flex-shrink: 0; cursor: pointer;
        }
        .option-item label { font-size: 16px; color: var(--text-primary); cursor: pointer; flex: 1; }
        .btn-group {
            display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px;
        }
        .btn {
            padding: 12px 28px; border: none; border-radius: 30px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: 0.2s; flex: 1 1 auto;
        }
        .btn-primary { background: var(--btn-primary); color: white; }
        .btn-primary:hover { background: var(--btn-primary-hover); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-success { background: var(--btn-success); color: white; }
        .btn-success:hover { background: #16a34a; }
        .feedback {
            margin: 15px 0 10px; padding: 12px 18px; border-radius: 12px;
            font-weight: 500; display: none; border-left: 5px solid;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: var(--correct-bg); border-color: #22c55e; color: #166534; }
        .feedback.wrong { background: var(--wrong-bg); border-color: #ef4444; color: #991b1b; }
        .score-box {
            margin-top: 20px; padding: 15px; background: var(--score-bg);
            color: white; border-radius: 16px; text-align: center;
            font-size: 18px; font-weight: 600; display: flex;
            justify-content: space-around; flex-wrap: wrap; gap: 10px;

        .score-box span { color: #facc15; }
        .score-detail {
            display: flex; gap: 20px; justify-content: center;
            font-weight: 400; font-size: 16px;
        }
        .score-detail .correct { color: #4ade80; }
        .score-detail .wrong { color: #f87171; }
        @media (max-width: 480px) {

            h1 { font-size: 18px; }
            #question { font-size: 17px; }
            .option-item { padding: 12px 14px; }
            .status-bar { font-size: 14px; }

    </style>

            { q: 'Main reason for Phony War?', options: ['They could win using WWI tactics', 'Germany was too strong', 'Hitler would surrender', 'The US would join immediately'], ans: 0 }

        // ================================================================

        let shuffledQuestions = [], currentIndex = 0, score = 0, correctCount = 0, wrongCount = 0, isAnswered = false, timerInterval = null, timeLeft = 20;
        const TOTAL_TIME = 20;
        const questionEl = document.getElementById('question');
        const optionsContainer = document.getElementById('options-container');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const feedbackEl = document.getElementById('feedback');
        const counterEl = document.getElementById('question-counter');
        const scoreCounter = document.getElementById('score-counter');
        const finalScore = document.getElementById('final-score');
        const totalQuestions = document.getElementById('total-questions');
        const progressBar = document.getElementById('progress-bar');
        const timerDisplay = document.getElementById('timer-display');
        const correctCountEl = document.getElementById('correct-count');
        const wrongCountEl = document.getElementById('wrong-count');

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function loadQuestion(index) {
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            isAnswered = false;
            const q = shuffledQuestions[index];
            if (!q) return;
            questionEl.textContent = `${index + 1}. ${q.q}`;
            counterEl.textContent = `Question ${index + 1}/${shuffledQuestions.length}`;
            const progress = ((index + 1) / shuffledQuestions.length) * 100;
            progressBar.style.width = `${progress}%`;
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'option-item';
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'mcq';
                radio.value = i;
                radio.id = `opt-${i}`;
                const label = document.createElement('label');
                label.htmlFor = `opt-${i}`;
                label.textContent = opt;
                div.appendChild(radio);
                div.appendChild(label);
                optionsContainer.appendChild(div);
                div.addEventListener('click', function(e) {
                    if (isAnswered) return;
                    const radioInput = this.querySelector('input[type="radio"]');
                    radioInput.checked = true;
                    document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
                    this.classList.add('selected');
                });
            });
            feedbackEl.className = 'feedback';
            feedbackEl.style.display = 'none';
            submitBtn.disabled = false;
            submitBtn.style.display = 'inline-block';
            nextBtn.style.display = 'none';
            document.querySelectorAll('.option-item').forEach(el => {
                el.classList.remove('correct', 'wrong', 'selected');
            });
            timeLeft = TOTAL_TIME;
            timerDisplay.textContent = `⏱️ ${timeLeft}s`;
            timerDisplay.classList.remove('warning');
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = `⏱️ ${timeLeft}s`;
                if (timeLeft <= 5) timerDisplay.classList.add('warning');
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    if (!isAnswered) {
                        const currentQ = shuffledQuestions[currentIndex];
                        const allOptions = document.querySelectorAll('.option-item');
                        allOptions.forEach((el, idx) => {
                            if (idx === currentQ.ans) el.classList.add('correct');
                            el.querySelector('input[type="radio"]').disabled = true;
                        });
                        const correctText = currentQ.options[currentQ.ans];
                        feedbackEl.textContent = `⏰ Time's up! Correct answer: "${correctText}"`;
                        feedbackEl.className = 'feedback show wrong';
                        isAnswered = true;
                        submitBtn.disabled = true;
                        submitBtn.style.display = 'none';
                        nextBtn.style.display = 'inline-block';
                        wrongCount++;
                        updateScoreDisplay();
                    }
                }
            }, 1000);
            updateScoreDisplay();
        }

        function checkAnswer() {
            if (isAnswered) return;
            const selected = document.querySelector('input[name="mcq"]:checked');
            if (!selected) { alert('Please select an option!'); return; }
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            const selectedValue = parseInt(selected.value);
            const currentQ = shuffledQuestions[currentIndex];
            const isCorrect = (selectedValue === currentQ.ans);
            const allOptions = document.querySelectorAll('.option-item');
            allOptions.forEach((el, idx) => {
                if (idx === currentQ.ans) el.classList.add('correct');
                else if (idx === selectedValue && !isCorrect) el.classList.add('wrong');
                el.querySelector('input[type="radio"]').disabled = true;
            });
            if (isCorrect) { score++; correctCount++; feedbackEl.textContent = '✅ Correct! Great job!'; feedbackEl.className = 'feedback show correct'; }
            else { wrongCount++; const correctText = currentQ.options[currentQ.ans]; feedbackEl.textContent = `❌ Incorrect. Correct answer: "${correctText}"`; feedbackEl.className = 'feedback show wrong'; }
            isAnswered = true;
            submitBtn.disabled = true;
            submitBtn.style.display = 'none';
            nextBtn.style.display = 'inline-block';
            updateScoreDisplay();
        }

        function nextQuestion() {
            if (currentIndex < shuffledQuestions.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                clearInterval(timerInterval);
                questionEl.textContent = '🎉 Quiz Complete! Amazing work!';
                optionsContainer.innerHTML = '';
                feedbackEl.style.display = 'none';
                submitBtn.style.display = 'none';
                nextBtn.style.display = 'none';
                document.querySelector('.status-bar').innerHTML = `<span>✅ Done!</span><span>Score: ${score}/${shuffledQuestions.length}</span>`;
                progressBar.style.width = '100%';
                timerDisplay.textContent = '🏁';
                updateScoreDisplay();
            }
        }

        function updateScoreDisplay() {
            scoreCounter.textContent = score;
            finalScore.textContent = score;
            totalQuestions.textContent = shuffledQuestions.length;
            correctCountEl.textContent = correctCount;
            wrongCountEl.textContent = wrongCount;
        }

        const darkToggle = document.getElementById('darkModeToggle');
        darkToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            darkToggle.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        });
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
            darkToggle.textContent = '☀️';
        }

        function initQuiz() {
            if (questions.length === 0) {
                document.getElementById('question').textContent = '⚠️ Error: Questions not found!';
                return;
            }
            shuffledQuestions = shuffleArray([...questions]);
            totalQuestions.textContent = shuffledQuestions.length;
            currentIndex = 0; score = 0; correctCount = 0; wrongCount = 0;
            loadQuestion(0);
        }
        submitBtn.addEventListener('click', checkAnswer);
        nextBtn.addEventListener('click', nextQuestion);
        initQuiz();
    </script>
