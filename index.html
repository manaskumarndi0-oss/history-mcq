<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Indian Constitution (350+ MCQ) - Master Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f0f4f9 0%, #d9e2ef 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .quiz-container {
            max-width: 850px;
            width: 100%;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 25px 70px rgba(0, 10, 40, 0.2);
            padding: 30px 35px;
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .header-strip {
            display: flex;
            height: 6px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 18px;
        }
        .header-strip span { flex: 1; }
        .strip-saffron { background: #FF9933; }
        .strip-white { background: #FFFFFF; }
        .strip-green { background: #138808; }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0b1f3b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            flex-wrap: wrap;
        }
        h1 small {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2a4a7a;
            background: #eef4ff;
            padding: 5px 18px;
            border-radius: 40px;
        }
        .progress-bar-container {
            background: #e6ecf5;
            border-radius: 30px;
            height: 10px;
            margin: 12px 0 22px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #FF9933, #138808);
            border-radius: 30px;
            transition: width 0.3s ease;
        }
        .question-number {
            font-size: 0.9rem;
            font-weight: 600;
            color: #2a4a7a;
            background: #eef4ff;
            display: inline-block;
            padding: 4px 18px;
            border-radius: 30px;
            margin-bottom: 15px;
        }
        .question-text {
            font-size: 1.4rem;
            font-weight: 500;
            color: #04122b;
            line-height: 1.6;
            margin-bottom: 28px;
            min-height: 70px;
        }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        .option-btn {
            background: #f8fbff;
            border: 2px solid #dfe6f0;
            border-radius: 18px;
            padding: 16px 22px;
            font-size: 1.05rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 18px;
            color: #1a2a4a;
            font-weight: 450;
        }
        .option-btn:hover:not(.disabled-opt) {
            background: #eaf1fd;
            border-color: #a0bada;
            transform: translateX(5px);
        }
        .option-btn .opt-label {
            font-weight: 700;
            color: #1a3a7a;
            background: #deeafe;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .option-btn.selected {
            border-color: #2563eb;
            background: #e3edfe;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }
        .option-btn.correct-answer {
            border-color: #16a34a;
            background: #dcfce7;
            box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.2);
        }
        .option-btn.correct-answer .opt-label {
            background: #16a34a;
            color: white;
        }
        .option-btn.wrong-answer {
            border-color: #dc2626;
            background: #fee2e2;
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.15);
        }
        .option-btn.wrong-answer .opt-label {
            background: #dc2626;
            color: white;
        }
        .option-btn.disabled-opt {
            cursor: default;
            opacity: 0.8;
        }
        .option-btn.disabled-opt:hover {
            transform: none;
            background: #f8fbff;
            border-color: #dfe6f0;
        }

        .feedback-area {
            min-height: 55px;
            padding: 14px 20px;
            border-radius: 18px;
            background: #f1f5f9;
            margin: 8px 0 22px 0;
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 500;
            border-left: 6px solid #94a3b8;
            transition: 0.2s;
        }
        .feedback-area.correct {
            background: #dcfce7;
            border-left-color: #16a34a;
            color: #14532d;
        }
        .feedback-area.wrong {
            background: #fee2e2;
            border-left-color: #dc2626;
            color: #7f1d1d;
        }
        .feedback-area .fb-emoji { font-size: 1.9rem; }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 8px 0 12px 0;
        }
        .nav-btn {
            background: white;
            border: 2px solid #d0d9e8;
            padding: 13px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            color: #1a2a4a;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 auto;
            justify-content: center;
            min-width: 90px;
        }
        .nav-btn:hover:not(:disabled) {
            background: #1a2a4a;
            color: white;
            border-color: #1a2a4a;
            transform: scale(1.02);
        }
        .nav-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }
        .nav-btn.check-btn {
            background: #2563eb;
            border-color: #2563eb;
            color: white;
            flex: 2;
        }
        .nav-btn.check-btn:hover:not(:disabled) {
            background: #1d4ed8;
            border-color: #1d4ed8;
        }
        .nav-btn.reset-btn {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }
        .nav-btn.reset-btn:hover { background: #e2e8f0; }

        .score-display {
            text-align: center;
            font-size: 1rem;
            font-weight: 600;
            color: #1a2a4a;
            background: #f8fbff;
            padding: 14px 18px;
            border-radius: 50px;
            border: 1px solid #dfe6f0;
            margin-top: 18px;
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        .score-display span { background: #eef4ff; padding: 2px 18px; border-radius: 30px; }
        .score-display .correct-count { color: #16a34a; }
        .score-display .wrong-count { color: #dc2626; }
        .score-display .total-count { color: #2563eb; }

        .result-screen {
            text-align: center;
            padding: 45px 15px;
        }
        .result-screen h2 { font-size: 2.6rem; margin-bottom: 12px; }
        .result-screen .big-score {
            font-size: 4.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FF9933, #138808);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .result-screen .sub-text { font-size: 1.3rem; color: #3a4a6a; margin-top: 5px; }

        @media (max-width: 650px) {
            .quiz-container { padding: 18px; }
            h1 { font-size: 1.3rem; flex-direction: column; align-items: start; gap: 6px; }
            .question-text { font-size: 1.15rem; }
            .option-btn { padding: 14px 16px; font-size: 0.95rem; }
            .nav-btn { padding: 10px 14px; font-size: 0.85rem; min-width: 60px; }
        }
    </style>
</head>

<div class="quiz-container" id="app">

        <div class="options-grid" id="optionsContainer"></div>
        <div class="feedback-area" id="feedbackArea">
            <span class="fb-emoji">📘</span>
            <span id="feedbackMsg">Select an option and press 'Check'</span>
        </div>
        <div class="nav-controls">
            <button class="nav-btn" id="prevBtn">◀ Previous</button>
            <button class="nav-btn check-btn" id="checkBtn">✅ Check</button>
            <button class="nav-btn" id="nextBtn">Next ▶</button>
        </div>
        <div class="score-display">
            <span>✅ Correct: <strong class="correct-count" id="correctScore">0</strong></span>
            <span>❌ Wrong: <strong class="wrong-count" id="wrongScore">0</strong></span>
            <span>📌 Seen: <strong class="total-count" id="seenCount">0</strong></span>
        </div>
    </div>

    <div id="resultScreen" class="result-screen" style="display: none;">
        <h2>🏁 Quiz Finished!</h2>
        <div class="big-score" id="finalScore">0%</div>
        <p class="sub-text" id="finalMsg">Great job!</p>
        <button class="nav-btn reset-btn" style="margin: 25px auto; width: auto; padding: 14px 40px;" onclick="resetQuiz()">🔄 Restart</button>
    </div>
</div>

    // -------------------------------------------------------------
    // 🧠 Application Logic
    // -------------------------------------------------------------
    let currentQ = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let seenCount = 0;
    let selectedOption = null;
    let isAnswered = false;
    const totalQ = questions.length;

    const qText = document.getElementById('qText');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedbackArea = document.getElementById('feedbackArea');
    const feedbackMsg = document.getElementById('feedbackMsg');
    const qNumDisplay = document.getElementById('qNumDisplay');
    const qCounter = document.getElementById('qCounter');
    const progressFill = document.getElementById('progressFill');
    const correctScore = document.getElementById('correctScore');
    const wrongScore = document.getElementById('wrongScore');
    const seenCountEl = document.getElementById('seenCount');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const checkBtn = document.getElementById('checkBtn');

    function renderQuestion(index) {
        const q = questions[index];
        if (!q) return;
        isAnswered = false;
        selectedOption = null;
        feedbackArea.className = 'feedback-area';
        feedbackMsg.innerHTML = 'Select an option and press "Check"';
        document.querySelector('.fb-emoji').textContent = '📘';
        qNumDisplay.textContent = `Question ${index + 1}`;
        qCounter.textContent = `${index + 1} / ${totalQ}`;
        qText.textContent = q.q;
        const progress = ((index + 1) / totalQ) * 100;
        progressFill.style.width = `${Math.min(progress, 100)}%`;
        optionsContainer.innerHTML = '';
        const labels = ['A', 'B', 'C', 'D'];
        q.o.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span class="opt-label">${labels[i]}</span> <span>${opt}</span>`;
            btn.dataset.index = i;
            btn.addEventListener('click', () => selectOption(i));
            optionsContainer.appendChild(btn);
        });
        prevBtn.disabled = (index === 0);
        nextBtn.disabled = (index === totalQ - 1);
        correctScore.textContent = correctCount;
        wrongScore.textContent = wrongCount;
        seenCountEl.textContent = seenCount;
    }

    function selectOption(index) {
        if (isAnswered) return;
        const btns = optionsContainer.querySelectorAll('.option-btn');
        btns.forEach((btn, i) => {
            btn.classList.remove('selected');
            if (i === index) btn.classList.add('selected');
        });
        selectedOption = index;
        feedbackArea.className = 'feedback-area';
        feedbackMsg.innerHTML = 'Press "Check" to verify.';
        document.querySelector('.fb-emoji').textContent = '✍️';
    }

    function checkAnswer() {
        if (isAnswered) return;
        if (selectedOption === null) {
            feedbackArea.className = 'feedback-area wrong';
            feedbackMsg.innerHTML = 'Please select an option first!';
            document.querySelector('.fb-emoji').textContent = '⚠️';
            return;
        }
        const q = questions[currentQ];
        const isCorrect = (selectedOption === q.a);
        const btns = optionsContainer.querySelectorAll('.option-btn');
        btns.forEach(btn => btn.classList.add('disabled-opt'));
        btns.forEach((btn, i) => {
            if (i === q.a) btn.classList.add('correct-answer');
            if (i === selectedOption && !isCorrect) btn.classList.add('wrong-answer');
        });
        if (isCorrect) {
            feedbackArea.className = 'feedback-area correct';
            feedbackMsg.innerHTML = '✅ Absolutely correct!';
            document.querySelector('.fb-emoji').textContent = '🎉';
            correctCount++;
        } else {
            feedbackArea.className = 'feedback-area wrong';
            feedbackMsg.innerHTML = `❌ Wrong. The correct answer is <strong>${['A','B','C','D'][q.a]}</strong>.`;
            document.querySelector('.fb-emoji').textContent = '😓';
            wrongCount++;
        }
        if (!seenCountEl.dataset.seen || !seenCountEl.dataset.seen.includes(currentQ)) {
            seenCount++;
            seenCountEl.dataset.seen = (seenCountEl.dataset.seen || '') + ',' + currentQ;
        }
        isAnswered = true;
        correctScore.textContent = correctCount;
        wrongScore.textContent = wrongCount;
        seenCountEl.textContent = seenCount;
    }

    function nextQuestion() {
        if (currentQ === totalQ - 1 && isAnswered) {
            showResult();
        } else if (currentQ < totalQ - 1) {
            currentQ++;
            renderQuestion(currentQ);
        }
    }

    function prevQuestion() {
        if (currentQ > 0) {
            currentQ--;
            renderQuestion(currentQ);
        }
    }

    function showResult() {
        document.getElementById('quizArea').style.display = 'none';
        document.getElementById('resultScreen').style.display = 'block';
        const totalAttempted = correctCount + wrongCount;
        const percentage = totalAttempted > 0 ? Math.round((correctCount / totalAttempted) * 100) : 0;
        document.getElementById('finalScore').textContent = `${percentage}%`;
        let msg = '💪 Keep practicing! Review your notes.';
        if (percentage >= 80) msg = '🏆 Excellent! You are a Constitution expert!';
        else if (percentage >= 60) msg = '👍 Good performance! Keep practicing.';
        else if (percentage >= 40) msg = '📖 Re-read the notes, you can do it!';
        document.getElementById('finalMsg').textContent = `${msg} (Correct: ${correctCount}, Wrong: ${wrongCount})`;
    }

    function resetQuiz() {
        currentQ = 0;
        correctCount = 0;
        wrongCount = 0;
        seenCount = 0;
        selectedOption = null;
        isAnswered = false;
        delete seenCountEl.dataset.seen;
        document.getElementById('quizArea').style.display = 'block';
        document.getElementById('resultScreen').style.display = 'none';
        renderQuestion(0);
    }

    checkBtn.addEventListener('click', function() {
        if (currentQ === totalQ - 1 && isAnswered) {
            showResult();
        } else {
            checkAnswer();
        }
    });
    nextBtn.addEventListener('click', nextQuestion);
    prevBtn.addEventListener('click', prevQuestion);
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') checkBtn.click();
        if (e.key === 'ArrowRight') nextBtn.click();
        if (e.key === 'ArrowLeft') prevBtn.click();
    });

    window.resetQuiz = resetQuiz;
    renderQuestion(0);
</script>
